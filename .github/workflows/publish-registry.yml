name: Publish Registry

on:
  push:
    branches: [main, master]
    paths:
      - "registry/**"
      - "packages/build-index/**"
      - "packages/schema/**"

concurrency:
  group: publish-registry
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build pipeline
        run: |
          pnpm --filter @clawmart/schema build
          pnpm --filter @clawmart/build-index build

      - name: Generate registry artefacts
        run: |
          node packages/build-index/dist/bin.js \
            --registry ./registry \
            --out ./dist \
            --cdn-base https://cdn.clawmart.dev \
            --site-base https://clawmart.dev \
            --generated-at "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"

      - name: Write health marker
        run: |
          cat > dist/health.json <<EOF
          {
            "generatedAt": "$(date -u +%Y-%m-%dT%H:%M:%S.000Z)",
            "commit": "${{ github.sha }}",
            "count": $(jq '.count' dist/registry.json)
          }
          EOF

      - name: Upload to Cloudflare R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx wrangler@3 r2 object put clawmart-cdn/registry.json \
            --file=dist/registry.json --content-type=application/json
          for f in skills agents commands hooks mcp presets; do
            if [ -f dist/$f.json ]; then
              npx wrangler@3 r2 object put clawmart-cdn/$f.json \
                --file=dist/$f.json --content-type=application/json
            fi
          done
          npx wrangler@3 r2 object put clawmart-cdn/sitemap.xml \
            --file=dist/sitemap.xml --content-type=application/xml
          npx wrangler@3 r2 object put clawmart-cdn/feed.xml \
            --file=dist/feed.xml --content-type=application/rss+xml
          npx wrangler@3 r2 object put clawmart-cdn/tombstones.json \
            --file=dist/tombstones.json --content-type=application/json
          npx wrangler@3 r2 object put clawmart-cdn/health.json \
            --file=dist/health.json --content-type=application/json

      - name: Reindex MeiliSearch
        env:
          MEILI_HOST: ${{ secrets.MEILISEARCH_HOST }}
          MEILI_KEY: ${{ secrets.MEILISEARCH_API_KEY }}
        run: |
          jq '.entries' dist/registry.json > dist/meili-entries.json
          curl -sS -X PUT "$MEILI_HOST/indexes/entries/documents" \
            -H "Authorization: Bearer $MEILI_KEY" \
            -H "Content-Type: application/json" \
            --data-binary @dist/meili-entries.json

      - name: Summary
        run: |
          echo "## Registry publish summary" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- Entries: $(jq '.count' dist/registry.json)" >> $GITHUB_STEP_SUMMARY
