name: Weekly Health

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch: {}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      issues: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build schema + validator
        run: |
          pnpm --filter @clawmart/schema build
          pnpm --filter @clawmart/build-index build
          pnpm --filter @clawmart/validator build

      - name: Re-run validator
        id: validate
        continue-on-error: true
        run: node packages/validator/dist/bin.js --registry registry

      - name: External link liveness
        id: links
        continue-on-error: true
        run: |
          set -e
          failed=0
          for f in $(find registry -name entry.json); do
            url=$(jq -r '.repository.url // empty' "$f")
            if [ -n "$url" ]; then
              if ! curl -sSfIL --max-time 15 "$url" >/dev/null 2>&1; then
                echo "::warning file=$f::dead link: $url"
                failed=$((failed + 1))
              fi
            fi
          done
          echo "failed_count=$failed" >> $GITHUB_OUTPUT

      - name: Open issue on any failure
        if: steps.validate.outcome == 'failure' || steps.links.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Weekly health check findings — ${today}`,
              labels: ["health-check", "needs-triage"],
              body: [
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                ``,
                `- Validator outcome: \`${{ steps.validate.outcome }}\``,
                `- Link check outcome: \`${{ steps.links.outcome }}\` (${{ steps.links.outputs.failed_count }} dead link(s))`,
              ].join("\n"),
            });
